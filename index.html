<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Gradient Styles</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #080810;
  color: #e0e0e8;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 48px;
  gap: 22px;
}

header {
  text-align: center;
}

h1 {
  font-size: 1.15rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}

#preview {
  width: 100%;
  max-width: 800px;
  height: 500px;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  background: #111118;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 8px 32px rgba(0,0,0,0.5),
    0 32px 80px rgba(0,0,0,0.4);
}

/* Tab bar */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 800px;
  width: 100%;
  justify-content: center;
}

.tab {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent;
  color: rgba(255,255,255,0.40);
  cursor: pointer;
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  transition: background 0.14s, color 0.14s, border-color 0.14s;
  white-space: nowrap;
  font-family: inherit;
}

.tab:hover  { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.80); }
.tab.active {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.30);
  color: #fff;
}

/* Controls */
.controls {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 9px 28px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  transition: opacity 0.14s, transform 0.08s;
  font-family: inherit;
}

.btn:active { transform: scale(0.96); }

.btn-start { background: #22c55e; color: #fff; }
.btn-start:hover  { opacity: 0.85; }
.btn-stop  { background: #ef4444; color: #fff; }
.btn-stop:hover   { opacity: 0.85; }
.btn-reset { background: #6366f1; color: #fff; }
.btn-reset:hover  { opacity: 0.85; }
</style>
</head>
<body>

<header><h1>Animated Gradient Styles</h1></header>

<div id="preview"></div>

<div class="tabs" id="tabs"></div>

<div class="controls">
  <button class="btn btn-start" id="btn-start">Start</button>
  <button class="btn btn-stop"  id="btn-stop">Stop</button>
  <button class="btn btn-reset" id="btn-reset">Reset</button>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
