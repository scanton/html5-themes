<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Gradient Styles</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #080810;
  color: #e0e0e8;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 48px;
  gap: 20px;
}

header { text-align: center; }
h1 {
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
}

/* ── Three-column stage ─────────────────────────────────── */
.stage {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  width: 100%;
  max-width: 1060px;
}

/* Panel group: scrollable list + fixed sliders below */
.panel-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 148px;
  flex-shrink: 0;
}

/* Side panels */
.panel {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: 420px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.12) transparent;
}
.panel::-webkit-scrollbar { width: 4px; }
.panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

/* Slider box */
.slider-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 8px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 9px;
}
.slider-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 2px;
}
.slider-name {
  font-size: 0.57rem;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
}
.slider-val {
  font-size: 0.60rem;
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.50);
  min-width: 34px;
  text-align: right;
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,0.14);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  margin: 0 0 4px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: rgba(255,255,255,0.78);
  cursor: pointer;
  box-shadow: 0 0 4px rgba(0,0,0,0.4);
}
input[type="range"]::-moz-range-thumb {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: rgba(255,255,255,0.78);
  border: none;
  cursor: pointer;
}

.panel-label {
  font-size: 0.60rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  padding: 0 6px 5px;
  flex-shrink: 0;
}

/* Preview */
#preview {
  width: 800px;
  height: 500px;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  background: #111118;
  flex-shrink: 0;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 8px 32px rgba(0,0,0,0.5),
    0 32px 80px rgba(0,0,0,0.4);
}

/* Tabs — shared base */
.tab {
  padding: 5px 10px;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.09);
  background: transparent;
  color: rgba(255,255,255,0.36);
  cursor: pointer;
  font-size: 0.71rem;
  letter-spacing: 0.02em;
  transition: background 0.13s, color 0.13s, border-color 0.13s;
  white-space: nowrap;
  text-align: left;
  font-family: inherit;
  width: 100%;
  flex-shrink: 0;
}
.tab:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.82); }

/* Background tab active */
.bg-tab.active {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.28);
  color: #fff;
}

/* Sprite tab active — purple accent */
.sprite-tab.active {
  background: rgba(120,70,255,0.18);
  border-color: rgba(150,100,255,0.42);
  color: #cdb8ff;
}

/* ── Preset strip ──────────────────────────────────────── */
.preset-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 1060px;
  width: 100%;
}
.preset-label {
  font-size: 0.60rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  padding: 0 2px;
}
#preset-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}

.preset-btn {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.09);
  background: transparent;
  color: rgba(255,255,255,0.38);
  cursor: pointer;
  font-size: 0.70rem;
  letter-spacing: 0.03em;
  white-space: nowrap;
  transition: background 0.13s, color 0.13s, border-color 0.13s;
  font-family: inherit;
  flex-shrink: 0;
}
.preset-btn:hover {
  background: rgba(255,195,60,0.10);
  border-color: rgba(255,195,60,0.30);
  color: rgba(255,210,90,0.90);
}
.preset-btn.active {
  background: rgba(255,180,40,0.16);
  border-color: rgba(255,190,60,0.45);
  color: #ffd060;
}

/* ── Controls ──────────────────────────────────────────── */
.controls { display: flex; gap: 10px; }
.btn {
  padding: 9px 28px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  transition: opacity 0.13s, transform 0.08s;
  font-family: inherit;
}
.btn:active { transform: scale(0.96); }
.btn-start { background: #22c55e; color: #fff; }
.btn-start:hover { opacity: 0.85; }
.btn-stop  { background: #ef4444; color: #fff; }
.btn-stop:hover  { opacity: 0.85; }
.btn-reset { background: #6366f1; color: #fff; }
.btn-reset:hover { opacity: 0.85; }
</style>
</head>
<body>

<header><h1>Animated Gradient Styles</h1></header>

<div class="stage">
  <!-- Left: background selection + speed -->
  <div class="panel-group">
    <div class="panel" id="bg-panel">
      <div class="panel-label">Background</div>
    </div>
    <div class="slider-box">
      <div class="slider-row">
        <span class="slider-name">Speed</span>
        <span class="slider-val" id="bg-speed-val">×1.0</span>
      </div>
      <input type="range" id="bg-speed" min="10" max="500" value="100" step="1">
    </div>
  </div>

  <!-- Centre: preview canvas -->
  <div id="preview"></div>

  <!-- Right: sprite selection + speed + density -->
  <div class="panel-group">
    <div class="panel" id="sprite-panel">
      <div class="panel-label">Sprites</div>
    </div>
    <div class="slider-box">
      <div class="slider-row">
        <span class="slider-name">Speed</span>
        <span class="slider-val" id="sp-speed-val">×1.0</span>
      </div>
      <input type="range" id="sp-speed" min="10" max="500" value="100" step="1">
      <div class="slider-row">
        <span class="slider-name">Density</span>
        <span class="slider-val" id="sp-density-val">×1.0</span>
      </div>
      <input type="range" id="sp-density" min="0" max="400" value="100" step="1">
    </div>
  </div>
</div>

<div class="preset-section">
  <div class="preset-label">Presets</div>
  <div id="preset-bar"></div>
</div>

<div class="controls">
  <button class="btn btn-start" id="btn-start">Start</button>
  <button class="btn btn-stop"  id="btn-stop">Stop</button>
  <button class="btn btn-reset" id="btn-reset">Reset</button>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
